<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Spam Detection Analytics</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .chart-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            padding: 20px;
        }
        
        .chart-title {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .nav-buttons {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .nav-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            margin: 0 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s ease;
        }
        
        .nav-btn:hover {
            transform: translateY(-2px);
        }
        
        .nav-btn.active {
            background: linear-gradient(45deg, #4CAF50, #45a049);
        }
        
        .loading-chart {
            text-align: center;
            padding: 50px;
            color: #666;
        }
        
        .error-chart {
            text-align: center;
            padding: 50px;
            color: #f44336;
            background: #ffebee;
            border-radius: 10px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        
        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .stat-label {
            color: #666;
            font-size: 1.1em;
        }
        
        .stat-card.success .stat-number {
            color: #4CAF50;
        }
        
        .stat-card.danger .stat-number {
            color: #f44336;
        }
        
        .stat-card.info .stat-number {
            color: #2196F3;
        }
        
        .stat-card.warning .stat-number {
            color: #ff9800;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="header">
            <h1>📊 Dashboard Analytics</h1>
            <p>Thống kê và phân tích dữ liệu Spam Detection</p>
        </div>

        <div class="nav-buttons">
            <a href="/" class="nav-btn">🏠 Trang Chủ</a>
            <a href="/dashboard" class="nav-btn active">📊 Dashboard</a>
        </div>

        <!-- Thống kê tổng quan -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card success">
                <div class="stat-number" id="totalEmails">-</div>
                <div class="stat-label">Tổng số Email</div>
            </div>
            <div class="stat-card danger">
                <div class="stat-number" id="spamEmails">-</div>
                <div class="stat-label">Email Spam</div>
            </div>
            <div class="stat-card info">
                <div class="stat-number" id="hamEmails">-</div>
                <div class="stat-label">Email Ham</div>
            </div>
            <div class="stat-card warning">
                <div class="stat-number" id="accuracy">-</div>
                <div class="stat-label">Độ chính xác (%)</div>
            </div>
        </div>

        <!-- Biểu đồ phân phối dữ liệu -->
        <div class="chart-container">
            <div class="chart-title">📈 Phân Phối Dữ Liệu</div>
            <div id="dataDistributionChart" class="loading-chart">
                Đang tải biểu đồ...
            </div>
        </div>

        <!-- Biểu đồ từ khóa -->
        <div class="chart-container">
            <div class="chart-title">🔤 Top Từ Khóa Spam</div>
            <div id="topWordsChart" class="loading-chart">
                Đang tải biểu đồ...
            </div>
        </div>

        <!-- Biểu đồ hiệu suất mô hình -->
        <div class="chart-container">
            <div class="chart-title">🎯 Hiệu Suất Mô Hình</div>
            <div id="modelPerformanceChart" class="loading-chart">
                Đang tải biểu đồ...
            </div>
        </div>
    </div>

    <script>
        // Load charts when page loads
        window.addEventListener('load', function() {
            loadStats();
            loadDataDistributionChart();
            loadTopWordsChart();
            loadModelPerformanceChart();
        });

        async function loadStats() {
            try {
                const response = await fetch('/api/charts/data-distribution');
                const chartData = await response.json();
                
                if (chartData && chartData.data && chartData.data[0]) {
                    const data = chartData.data[0];
                    const totalEmails = data.values[0] + data.values[1];
                    const hamEmails = data.values[0];
                    const spamEmails = data.values[1];
                    const accuracy = 95.46; // From model training
                    
                    const totalEmailsEl = document.getElementById('totalEmails');
                    const spamEmailsEl = document.getElementById('spamEmails');
                    const hamEmailsEl = document.getElementById('hamEmails');
                    const accuracyEl = document.getElementById('accuracy');
                    
                    if (totalEmailsEl) totalEmailsEl.textContent = totalEmails.toLocaleString();
                    if (spamEmailsEl) spamEmailsEl.textContent = spamEmails.toLocaleString();
                    if (hamEmailsEl) hamEmailsEl.textContent = hamEmails.toLocaleString();
                    if (accuracyEl) accuracyEl.textContent = accuracy + '%';
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        async function loadDataDistributionChart() {
            try {
                const response = await fetch('/api/charts/data-distribution');
                const chartData = await response.json();
                
                if (chartData) {
                    Plotly.newPlot('dataDistributionChart', chartData.data, chartData.layout, {responsive: true});
                } else {
                    document.getElementById('dataDistributionChart').innerHTML = 
                        '<div class="error-chart">Không thể tải biểu đồ phân phối dữ liệu</div>';
                }
            } catch (error) {
                console.error('Error loading data distribution chart:', error);
                document.getElementById('dataDistributionChart').innerHTML = 
                    '<div class="error-chart">Lỗi khi tải biểu đồ phân phối dữ liệu</div>';
            }
        }

        async function loadTopWordsChart() {
            try {
                const response = await fetch('/api/charts/top-words');
                const chartData = await response.json();
                
                if (chartData) {
                    Plotly.newPlot('topWordsChart', chartData.data, chartData.layout, {responsive: true});
                } else {
                    document.getElementById('topWordsChart').innerHTML = 
                        '<div class="error-chart">Không thể tải biểu đồ từ khóa</div>';
                }
            } catch (error) {
                console.error('Error loading top words chart:', error);
                document.getElementById('topWordsChart').innerHTML = 
                    '<div class="error-chart">Lỗi khi tải biểu đồ từ khóa</div>';
            }
        }

        async function loadModelPerformanceChart() {
            try {
                const response = await fetch('/api/charts/model-performance');
                const chartData = await response.json();
                
                if (chartData) {
                    Plotly.newPlot('modelPerformanceChart', chartData.data, chartData.layout, {responsive: true});
                } else {
                    document.getElementById('modelPerformanceChart').innerHTML = 
                        '<div class="error-chart">Không thể tải biểu đồ hiệu suất mô hình</div>';
                }
            } catch (error) {
                console.error('Error loading model performance chart:', error);
                document.getElementById('modelPerformanceChart').innerHTML = 
                    '<div class="error-chart">Lỗi khi tải biểu đồ hiệu suất mô hình</div>';
            }
        }

        // Refresh charts every 30 seconds
        setInterval(function() {
            loadStats();
        }, 30000);
    </script>
</body>
</html>
