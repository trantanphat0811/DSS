<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dự đoán BMI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #764ba2 0%, #667eea 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        header { background: white; padding: 26px; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-bottom: 24px; text-align: center; }
        h1 { color: #764ba2; font-size: 2.1em; margin-bottom: 8px; }
        .subtitle { color: #666; }
        .nav { margin-top: 10px; }
        .nav a { color: #667eea; font-weight: 600; text-decoration: none; margin: 0 8px; }
        .card { background: white; padding: 24px; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .card h2 { color: #667eea; margin-bottom: 16px; font-size: 1.4em; border-bottom: 2px solid #667eea; padding-bottom: 8px; }
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
        .form-group label { display: block; margin-bottom: 8px; color: #333; font-weight: 600; }
        .form-group input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 1em; transition: border-color 0.3s; }
        .form-group input:focus { outline: none; border-color: #667eea; }
        .btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 14px 26px; border: none; border-radius: 8px; font-size: 1.05em; cursor: pointer; font-weight: 600; margin-top: 12px; }
        .result { margin-top: 16px; padding: 16px; background: #f0f4ff; border-left: 4px solid #667eea; border-radius: 8px; display: none; }
        .result.show { display: block; }
        .result-value { font-size: 1.8em; color: #667eea; font-weight: bold; }
    </style>
    <script>
        async function onSubmit(e) {
            e.preventDefault();
            const inputs = e.target.querySelectorAll('input');
            const data = {};
            inputs.forEach(input => { if (input.value) data[input.id] = parseFloat(input.value); });
            const res = await fetch('/predict', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            const result = await res.json();
            const el = document.getElementById('predictionResult');
            const val = document.getElementById('predictedBMI');
            if (result.success) { val.textContent = result.predicted_bmi; el.classList.add('show'); }
            else { val.textContent = '-'; el.classList.add('show'); alert(result.error || 'Có lỗi xảy ra'); }
        }
        window.addEventListener('DOMContentLoaded', () => { document.getElementById('predictionForm').addEventListener('submit', onSubmit); });
    </script>
    
</head>
<body>
    <div class="container">
        <header>
            <h1>🔮 Dự đoán BMI</h1>
            <p class="subtitle">Nhập thông tin để dự đoán BMI bằng mô hình tuyến tính</p>
            <div class="nav">
                <a href="/">Biểu đồ</a>
                <a href="/predict-page">Dự đoán</a>
            </div>
        </header>

        <div class="card">
            <h2>Thông tin đầu vào</h2>
            <form id="predictionForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Tuổi (Age)</label>
                        <input type="number" id="Age" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label>Cân nặng (kg)</label>
                        <input type="number" id="Weight (kg)" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label>Chiều cao (m)</label>
                        <input type="number" id="Height (m)" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>Max BPM</label>
                        <input type="number" id="Max_BPM" step="0.1">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Avg BPM</label>
                        <input type="number" id="Avg_BPM" step="0.1">
                    </div>
                    <div class="form-group">
                        <label>Resting BPM</label>
                        <input type="number" id="Resting_BPM" step="0.1">
                    </div>
                    <div class="form-group">
                        <label>Calories Burned</label>
                        <input type="number" id="Calories_Burned" step="0.1">
                    </div>
                    <div class="form-group">
                        <label>Fat Percentage</label>
                        <input type="number" id="Fat_Percentage" step="0.1">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Lượng nước uống mỗi ngày (liters)</label>
                        <input type="number" id="Water_Intake (liters)" step="0.1">
                    </div>
                    <div class="form-group">
                        <label>Tần suất tập luyện (ngày/tuần)</label>
                        <input type="number" id="Workout_Frequency (days/week)" step="0.1">
                    </div>
                    <div class="form-group">
                        <label>Thời lượng mỗi buổi (giờ)</label>
                        <input type="number" id="Session_Duration (hours)" step="0.1">
                    </div>
                    <div class="form-group">
                        <label>Cấp độ kinh nghiệm</label>
                        <input type="number" id="Experience_Level" step="0.1">
                    </div>
                </div>
                <button type="submit" class="btn">Dự đoán BMI</button>
            </form>
            <div class="result" id="predictionResult">
                <div style="font-weight: 600; color: #333;">Dự đoán BMI:</div>
                <div class="result-value" id="predictedBMI">-</div>
            </div>
        </div>
    </div>
</body>
</html>
